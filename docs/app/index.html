  <style>
    :root {
      --bg: #FCF9F2;
      --surface: #FFFFFF;
      --text: #1D1D1F;
      --muted: #605E58;
      --accent: #6E1619;
      --accent-hover: #530F11;
      --border: rgba(36, 37, 31, 0.10);
      --shadow: 0 22px 48px rgba(30, 20, 14, 0.10);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0D0D0F;
        --surface: #18181B;
        --text: #F7F3EA;
        --muted: #A19F99;
        --accent: #952F2D;
        --accent-hover: #B13B39;
        --border: rgba(255, 255, 255, 0.10);
        --shadow: 0 24px 52px rgba(0, 0, 0, 0.55);
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Public Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px 40px;
      -webkit-font-smoothing: antialiased;
    }
    .card {
      width: 100%;
      max-width: 540px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 28px;
      box-shadow: var(--shadow);
      overflow: hidden;
      text-align: center;
    }
    .banner-wrap {
      width: 100%;
      background: #FCF9F2;
      border-bottom: 1px solid var(--border);
      padding: 16px 16px 12px;
    }
    .banner-img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 14px;
    }
    .body {
      padding: 28px 24px 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .eyebrow {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.6px;
      text-transform: uppercase;
      color: var(--accent);
    }
    h1 {
      font-family: 'Newsreader', Georgia, serif;
      font-size: clamp(26px, 5.5vw, 34px);
      line-height: 1.15;
      font-weight: 700;
    }
    .subtitle {
      font-size: 15px;
      line-height: 1.5;
      color: var(--muted);
      max-width: 420px;
    }
    .cta-primary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      max-width: 340px;
      padding: 15px 22px;
      border-radius: 16px;
      background: var(--accent);
      color: #FFFFFF;
      font-weight: 700;
      font-size: 16px;
      text-decoration: none;
      transition: transform 0.15s ease, background 0.15s ease;
      margin-top: 4px;
    }
    .cta-primary:hover {
      background: var(--accent-hover);
      transform: translateY(-1px);
    }
    .badges-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin-top: 4px;
    }
    .badge-link {
      display: inline-flex;
      align-items: center;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }
    .badge-link:hover {
      transform: translateY(-1px);
      opacity: 0.92;
    }
    .badge-link.active-platform {
      outline: 2px solid var(--accent);
      outline-offset: 4px;
      border-radius: 10px;
    }
    .store-img {
      height: 48px;
      width: auto;
      display: block;
    }
    .qr-section {
      margin-top: 8px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    .qr-img {
      width: 148px;
      height: 148px;
      border-radius: 16px;
      border: 1px solid var(--border);
      background: #FFFFFF;
      padding: 6px;
    }
    .qr-caption {
      font-size: 12px;
      color: var(--muted);
    }
    .web-link {
      margin-top: 8px;
      font-size: 14px;
      font-weight: 600;
      color: var(--accent);
      text-decoration: none;
    }
    .web-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="banner-wrap">
      <img class="banner-img" src="../images/branding/app-share-og.png" alt="Alaba a Dios Donde Estés — Himnario El Buen Pastor" width="1200" height="630">
    </div>
    <div class="body">
      <span class="eyebrow">Iglesia El Buen Pastor · App Oficial</span>
      <h1>Lleva tu Himnario Contigo</h1>
      <p class="subtitle">637 himnos y 124 coritos con letras, buscador rápido, modo proyector y grabaciones de audio sin conexión.</p>

      <a id="smart-cta" class="cta-primary" href="https://apps.apple.com/app/id6794435414">
        <span id="smart-cta-text">Descargar la Aplicación</span>
      </a>

      <div class="badges-row">
        <a id="ios-badge" class="badge-link" href="https://apps.apple.com/app/id6794435414" target="_blank" rel="noopener noreferrer" aria-label="Descargar en el App Store">
          <img class="store-img" src="../images/branding/app-store-badge-black.png" alt="Disponible en el App Store">
        </a>
        <a id="android-badge" class="badge-link" href="https://play.google.com/apps/testing/com.elbuenpastor.himnario" target="_blank" rel="noopener noreferrer" aria-label="Descargar en Google Play">
          <img class="store-img" src="../images/branding/google-play-badge-black.svg" alt="Disponible en Google Play">
        </a>
      </div>

      <div class="qr-section">
        <img class="qr-img" src="../downloads/ebp-smart-app-qr.png" alt="Código QR para descargar Himnario El Buen Pastor" width="148" height="148">
        <span class="qr-caption">Escanea con la cámara de tu teléfono para instalar</span>
      </div>

      <a class="web-link" href="../">Abrir el Himnario en el navegador →</a>
    </div>
  </main>

  <script>
    (function () {
      var ua = navigator.userAgent || navigator.vendor || window.opera || '';
      var isAndroid = /android/i.test(ua);
      var isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      var cta = document.getElementById('smart-cta');
      var ctaText = document.getElementById('smart-cta-text');
      var iosBadge = document.getElementById('ios-badge');
      var androidBadge = document.getElementById('android-badge');

      var iosUrl = 'https://apps.apple.com/app/id6794435414';
      var androidUrl = 'https://play.google.com/apps/testing/com.elbuenpastor.himnario';

      if (isIOS) {
        cta.href = iosUrl;
        ctaText.textContent = 'Descargar en el App Store';
        iosBadge.classList.add('active-platform');
      } else if (isAndroid) {
        cta.href = androidUrl;
        ctaText.textContent = 'Descargar en Google Play';
        androidBadge.classList.add('active-platform');
      } else {
        cta.href = iosUrl;
        ctaText.textContent = 'Descargar en App Store / Google Play';
      }
    })();
  </script>
